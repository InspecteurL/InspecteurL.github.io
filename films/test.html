<!DOCTYPE html>

<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Lecteur vidéo</title>

  <style>
    body {
      margin: 0;
      background: #000;
      overflow: hidden;
    }

    #player {
      width: 100%;
      height: 500px;
      border: none;
    }

    #message {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;

      padding: 10px 20px;
      background: rgba(0, 0, 0, 0.85);
      color: white;

      font-family: Arial, sans-serif;
      font-size: 16px;

      display: none;
    }
  </style>

</head>

<body>

  <div id="message"></div>

  <iframe
    id="player"
    src="https://www.m3u8player.online/embed/m3u8?url=https%3A%2F%2Ffree.finepulfe.xyz%2Fmovies%2F429617-wus82%2F720p%2Fplaylist.m3u8"
    width="100%"
    height="500"
    style="border:none;"
    allow="fullscreen"
    allowfullscreen>
  </iframe>

  <script>
    const iframe = document.getElementById("player");
    const message = document.getElementById("message");

    // Détection de Chrome Desktop
    const isChromePC =
      /Chrome/.test(navigator.userAgent) &&
      !/Edg/.test(navigator.userAgent) &&
      !/OPR/.test(navigator.userAgent) &&
      !/Android/.test(navigator.userAgent) &&
      !/Mobile/.test(navigator.userAgent);

    function showMessage(text) {
      message.textContent = text;
      message.style.display = "block";
    }

    function hideMessage() {
      message.style.display = "none";
    }

    if (isChromePC) {

      iframe.addEventListener("load", function () {

        console.log("Iframe chargée.");

        // Petite attente pour laisser le lecteur initialiser la vidéo
        setTimeout(function () {

          console.log("Tentative de mise en pause...");

          iframe.contentWindow.postMessage(
            {
              type: "pause"
            },
            "https://www.m3u8player.online"
          );

          showMessage(
            "Initialisation audio... Reprise dans 3 minutes."
          );

          // Attendre 3 minutes
          setTimeout(function () {

            console.log("Tentative de reprise...");

            iframe.contentWindow.postMessage(
              {
                type: "play"
              },
              "https://www.m3u8player.online"
            );

            hideMessage();

          }, 180000);

        }, 3000);

      });

    } else {

      console.log(
        "Navigateur non concerné : lecture normale."
      );

    }
  </script>

</body>
</html>
