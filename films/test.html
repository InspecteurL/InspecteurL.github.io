<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lecteur vidéo – Pause 3 min</title>
  <style>
    body {
      margin: 0;
      background: #000;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    #player {
      width: 100%;
      height: 100vh;
      border: none;
    }
    #message {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      padding: 12px 24px;
      background: rgba(0, 0, 0, 0.85);
      color: #fff;
      font-size: 18px;
      border-radius: 8px;
      display: none;
      text-align: center;
      min-width: 220px;
    }
  </style>
</head>
<body>
  <div id="message"></div>

  <iframe
    id="player"
    src="https://www.m3u8player.online/embed/m3u8?url=https%3A%2F%2Ffree.finepulfe.xyz%2Fmovies%2F429617-wus82%2F720p%2Fplaylist.m3u8"
    allow="fullscreen; autoplay"
    allowfullscreen>
  </iframe>

<script>
  const iframe = document.getElementById("player");
  const messageEl = document.getElementById("message");

  // ——— Envoi des commandes pause / play ———
  function sendCommands(type) {
    const messages = [
      { type },
      { action: type },
      { command: type },
      { event: type },
      { method: type },
      { type: "video", action: type },
      { command: "player", action: type },
      { name: type },
      { player: type }
    ];

    messages.forEach(msg => {
      try {
        iframe.contentWindow.postMessage(msg, "https://www.m3u8player.online");
      } catch (e) {}
    });
  }

  function pauseVideo() {
    sendCommands("pause");
  }

  function playVideo() {
    sendCommands("play");
  }

  // ——— Compteur de 3 minutes ———
  let remaining = 180; // 3 minutes en secondes
  let countdownInterval = null;

  function formatTime(sec) {
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return `${m}:${s.toString().padStart(2, "0")}`;
  }

  function startCountdown() {
    messageEl.style.display = "block";
    messageEl.textContent = `Lecture dans ${formatTime(remaining)}`;

    countdownInterval = setInterval(() => {
      remaining--;
      if (remaining <= 0) {
        clearInterval(countdownInterval);
        messageEl.textContent = "Lecture en cours…";
        playVideo();

        // On cache le message après 2 secondes
        setTimeout(() => {
          messageEl.style.display = "none";
        }, 2000);
      } else {
        messageEl.textContent = `Lecture dans ${formatTime(remaining)}`;
      }
    }, 1000);
  }

  // ——— Lancement ———
  iframe.addEventListener("load", () => {
    // On essaie de mettre en pause plusieurs fois (le player peut prendre un peu de temps)
    const pauseAttempts = [300, 800, 1500, 2500, 4000];

    pauseAttempts.forEach(delay => {
      setTimeout(pauseVideo, delay);
    });

    // On démarre le compteur après la première tentative de pause
    setTimeout(startCountdown, 1000);
  });
</script>
</body>
</html>
