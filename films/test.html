<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lecteur – Pause 3 min</title>
  <style>
    body {
      margin: 0;
      background: #000;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    #player {
      width: 100%;
      height: 100vh;
      border: none;
    }
    #overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.92);
      z-index: 9998;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      text-align: center;
    }
    #countdown {
      font-size: 64px;
      font-weight: bold;
      margin-bottom: 20px;
      letter-spacing: 2px;
    }
    #status {
      font-size: 20px;
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <div id="overlay">
    <div id="countdown">3:00</div>
    <div id="status">La vidéo reprendra automatiquement…</div>
  </div>

  <iframe
    id="player"
    src="https://www.m3u8player.online/embed/m3u8?url=https%3A%2F%2Ffree.finepulfe.xyz%2Fmovies%2F429617-wus82%2F720p%2Fplaylist.m3u8&autoplay=false&muted=false&controls=true"
    allow="fullscreen; autoplay"
    allowfullscreen>
  </iframe>

<script>
  const iframe = document.getElementById("player");
  const overlay = document.getElementById("overlay");
  const countdownEl = document.getElementById("countdown");
  const statusEl = document.getElementById("status");

  let remaining = 180; // 3 minutes
  let playerReady = false;

  // ——— Envoi des commandes (plusieurs formats) ———
  function sendCommand(action) {
    if (!iframe.contentWindow) return;

    const messages = [
      { type: action },
      { action: action },
      { command: action },
      { type: "player", action: action },
      { name: action }
    ];

    messages.forEach(msg => {
      try {
        iframe.contentWindow.postMessage(msg, "https://www.m3u8player.online");
      } catch (e) {}
    });
  }

  // ——— Écoute du signal "playerReady" ———
  window.addEventListener("message", (event) => {
    if (event.origin !== "https://www.m3u8player.online") return;

    if (event.data && event.data.type === "playerReady") {
      playerReady = true;
      console.log("Player prêt !");
      // On essaie immédiatement de mettre en pause
      sendCommand("pause");
    }
  });

  // ——— Compteur ———
  function formatTime(sec) {
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return `${m}:${s.toString().padStart(2, "0")}`;
  }

  const timer = setInterval(() => {
    remaining--;
    countdownEl.textContent = formatTime(remaining);

    if (remaining <= 0) {
      clearInterval(timer);

      // On enlève le voile
      overlay.style.display = "none";

      // On force la lecture
      sendCommand("play");
      // On renvoie plusieurs fois au cas où
      setTimeout(() => sendCommand("play"), 500);
      setTimeout(() => sendCommand("play"), 1500);
    }
  }, 1000);

  // Tentatives de pause régulières pendant les 3 minutes
  // (au cas où le player démarre quand même)
  const pauseInterval = setInterval(() => {
    if (remaining > 0) {
      sendCommand("pause");
    } else {
      clearInterval(pauseInterval);
    }
  }, 2000);
</script>
</body>
</html>
