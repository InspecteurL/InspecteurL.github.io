<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lecteur vidéo – Pause 3 min</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    body {
      margin: 0;
      background: #000;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    #video {
      width: 100%;
      height: 100vh;
      background: #000;
      object-fit: contain;
    }
    #message {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      padding: 12px 24px;
      background: rgba(0, 0, 0, 0.85);
      color: #fff;
      font-size: 18px;
      border-radius: 8px;
      display: none;
      text-align: center;
      min-width: 220px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="message"></div>

  <video id="video" controls playsinline></video>

<script>
  const video = document.getElementById("video");
  const messageEl = document.getElementById("message");
  const streamUrl = "https://free.finepulfe.xyz/movies/429617-wus82/720p/playlist.m3u8";

  // ——— Chargement du flux m3u8 ———
  if (Hls.isSupported()) {
    const hls = new Hls();
    hls.loadSource(streamUrl);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      // On laisse un tout petit peu jouer puis on met en pause
      video.play().then(() => {
        setTimeout(() => {
          video.pause();
          startCountdown();
        }, 400); // 0,4 seconde de lecture puis pause
      }).catch(() => {
        // Si l'autoplay est bloqué, on met quand même le compteur
        startCountdown();
      });
    });
  } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
    // Safari natif
    video.src = streamUrl;
    video.addEventListener("loadedmetadata", () => {
      video.play().then(() => {
        setTimeout(() => {
          video.pause();
          startCountdown();
        }, 400);
      }).catch(() => startCountdown());
    });
  }

  // ——— Compteur de 3 minutes ———
  let remaining = 180; // 3 minutes
  let countdownInterval = null;

  function formatTime(sec) {
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return `${m}:${s.toString().padStart(2, "0")}`;
  }

  function startCountdown() {
    messageEl.style.display = "block";
    messageEl.textContent = `Lecture dans ${formatTime(remaining)}`;

    countdownInterval = setInterval(() => {
      remaining--;
      if (remaining <= 0) {
        clearInterval(countdownInterval);
        messageEl.textContent = "Lecture en cours…";
        video.play();

        setTimeout(() => {
          messageEl.style.display = "none";
        }, 2000);
      } else {
        messageEl.textContent = `Lecture dans ${formatTime(remaining)}`;
      }
    }, 1000);
  }
</script>
</body>
</html>
