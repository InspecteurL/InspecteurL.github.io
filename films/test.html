<!DOCTYPE html>

<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Lecteur vidéo</title>

  <style>
    body {
      margin: 0;
      background: #000;
      overflow: hidden;
    }

    #player {
      width: 100%;
      height: 500px;
      border: none;
    }

    #message {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;

      padding: 10px 20px;
      background: rgba(0, 0, 0, 0.85);
      color: white;

      font-family: Arial, sans-serif;
      font-size: 16px;

      display: none;
    }
  </style>

</head>

<body>

  <div id="message"></div>

  <iframe
    id="player"
    src="https://www.m3u8player.online/embed/m3u8?url=https%3A%2F%2Ffree.finepulfe.xyz%2Fmovies%2F429617-wus82%2F720p%2Fplaylist.m3u8"
    width="100%"
    height="500"
    style="border:none;"
    allow="fullscreen"
    allowfullscreen>
  </iframe>

<script>
  const iframe = document.getElementById("player");

  function sendPauseCommands() {

    const messages = [
      { type: "pause" },
      { action: "pause" },
      { command: "pause" },
      { event: "pause" },
      { method: "pause" },
      { type: "video", action: "pause" },
      { command: "player", action: "pause" }
    ];

    messages.forEach(function(message) {

      console.log(
        "Envoi au lecteur :",
        JSON.stringify(message)
      );

      iframe.contentWindow.postMessage(
        message,
        "https://www.m3u8player.online"
      );

    });
  }

  function sendPlayCommands() {

    const messages = [
      { type: "play" },
      { action: "play" },
      { command: "play" },
      { event: "play" },
      { method: "play" },
      { type: "video", action: "play" },
      { command: "player", action: "play" }
    ];

    messages.forEach(function(message) {

      console.log(
        "Envoi au lecteur :",
        JSON.stringify(message)
      );

      iframe.contentWindow.postMessage(
        message,
        "https://www.m3u8player.online"
      );

    });
  }

  // Test après 5 secondes
  setTimeout(function() {

    console.log("Tentative de pause...");
    sendPauseCommands();

  }, 5000);

  // Test de reprise après 3 minutes
  setTimeout(function() {

    console.log("Tentative de lecture...");
    sendPlayCommands();

  }, 185000);
</script>

</body>
</html>
