<script>

/* =========================================================
   CONFIGURATION API
========================================================= */

const API_BASE =
  "https://streamfree.top/api/v1";


/* =========================================================
   VARIABLES HERO
========================================================= */

let heroStreams = [];

let currentHeroIndex = 0;

let heroStream = null;

let heroTimer = null;

let isHeroAnimating = false;

const HERO_INTERVAL = 8000;


/* =========================================================
   VARIABLES MODAL
========================================================= */

const modal =
  document.getElementById(
    'playerModal'
  );


const modalVideo =
  document.getElementById(
    'modalVideo'
  );


const modalTitle =
  document.getElementById(
    'modalTitle'
  );


const modalDescription =
  document.getElementById(
    'modalDescription'
  );


/* =========================================================
   CHARGER LE HERO DEPUIS L'API
========================================================= */

async function fetchHeroStreams(
  category = "soccer"
){

  const heroLoading =
    document.getElementById(
      'hero-loading'
    );


  try{


    const res =
      await fetch(
        `${API_BASE}/streams?category=${encodeURIComponent(category)}`
      );


    if(
      !res.ok
    ){

      throw new Error(
        `Erreur API : ${res.status}`
      );

    }


    const data =
      await res.json();


    /*
      On récupère uniquement
      les streams disponibles.
    */

    heroStreams =
      Array.isArray(
        data.streams
      )
        ? data.streams
        : [];


    if(
      heroStreams.length === 0
    ){

      heroLoading.textContent =
        "Aucun événement en direct pour le moment.";

      return;

    }


    /*
      Création des points
      de navigation.
    */

    createHeroDots();


    /*
      Afficher le premier événement.
    */

    showHeroSlide(
      0,
      true
    );


    /*
      Démarrer la rotation automatique.
    */

    startHeroSlider();


  }catch(err){


    console.error(
      "Erreur Hero API :",
      err
    );


    heroLoading.textContent =
      "Impossible de charger les événements.";

  }

}


/* =========================================================
   AFFICHER UN SLIDE HERO
========================================================= */

function showHeroSlide(
  index,
  firstLoad = false
){


  if(
    !heroStreams.length
  ){

    return;

  }


  if(
    isHeroAnimating &&
    !firstLoad
  ){

    return;

  }


  currentHeroIndex =
    (
      index +
      heroStreams.length
    )
    %
    heroStreams.length;


  heroStream =
    heroStreams[
      currentHeroIndex
    ];


  const heroCard =
    document.getElementById(
      'hero-card'
    );


  const heroLoading =
    document.getElementById(
      'hero-loading'
    );


  const heroContent =
    document.getElementById(
      'hero-content'
    );


  const heroTitle =
    document.getElementById(
      'hero-title'
    );


  const heroSub =
    document.getElementById(
      'hero-sub'
    );


  const bgFar =
    document.getElementById(
      'bg-far'
    );


  const bgMid =
    document.getElementById(
      'bg-mid'
    );


  const bgFront =
    document.getElementById(
      'bg-front'
    );


  /*
    Récupérer les données.
  */

  const title =
    heroStream.name ||
    "Événement en direct";


  const league =
    heroStream.league ||
    heroStream.category ||
    "Sport en direct";


  const thumbnail =
    heroStream.thumbnail_url ||
    "";


  /*
    Premier chargement :
    pas d'animation de sortie.
  */

  if(
    firstLoad
  ){

    updateHeroContent();

    return;

  }


  /*
    Animation de sortie.
  */

  isHeroAnimating = true;

  heroCard.classList.add(
    'slide-out'
  );


  setTimeout(
    () => {


      /*
        Mettre à jour le contenu.
      */

      heroTitle.textContent =
        title;


      heroSub.textContent =
        `${league} • En direct • Qualité HD`;


      /*
        Mettre à jour les images.
      */

      if(
        thumbnail
      ){

        bgFar.style.backgroundImage =
          `url("${thumbnail}")`;


        bgMid.style.backgroundImage =
          `url("${thumbnail}")`;


        bgFront.style.backgroundImage =
          `url("${thumbnail}")`;

      }


      /*
        Réactiver les backgrounds.
      */

      bgFar.classList.add(
        'active'
      );


      bgMid.classList.add(
        'active'
      );


      bgFront.classList.add(
        'active'
      );


      /*
        Animation entrée.
      */

      heroCard.classList.remove(
        'slide-out'
      );


      heroCard.classList.remove(
        'slide-in'
      );


      void heroCard.offsetWidth;


      heroCard.classList.add(
        'slide-in'
      );


      /*
        Mettre à jour les dots.
      */

      updateHeroDots();


      isHeroAnimating = false;


    },
    450
  );

}

========================================================= */

/* =========================================================
   CRÉER LES DOTS
========================================================= */

function createHeroDots(){


  const dotsContainer =
    document.getElementById(
      'hero-dots'
    );


  dotsContainer.innerHTML =
    "";


  heroStreams.forEach(
    (stream,index) => {


      const dot =
        document.createElement(
          'div'
        );


      dot.className =
        'hero-dot';


      dot.title =
        stream.name ||
        `Événement ${index + 1}`;


      dot.addEventListener(
        'click',
        () => {


          showHeroSlide(
            index
          );


          restartHeroSlider();


        }
      );


      dotsContainer.appendChild(
        dot
      );


    }
  );

}


/* =========================================================
   METTRE À JOUR LES DOTS
========================================================= */

function updateHeroDots(){


  const dots =
    document.querySelectorAll(
      '.hero-dot'
    );


  dots.forEach(
    (dot,index) => {


      dot.classList.toggle(
        'active',

        index ===
        currentHeroIndex
      );


    }
  );

}


/* =========================================================
   SLIDER AUTOMATIQUE
========================================================= */

function startHeroSlider(){


  stopHeroSlider();


  if(
    heroStreams.length <= 1
  ){

    return;

  }


  heroTimer =
    setInterval(
      () => {


        showHeroSlide(
          currentHeroIndex + 1
        );


      },
      HERO_INTERVAL
    );

}


/* =========================================================
   STOPPER LE SLIDER
========================================================= */

function stopHeroSlider(){


  if(
    heroTimer
  ){

    clearInterval(
      heroTimer
    );


    heroTimer =
      null;

  }

}


/* =========================================================
   REDÉMARRER LE SLIDER
========================================================= */

function restartHeroSlider(){


  stopHeroSlider();


  startHeroSlider();

}


/* =========================================================
   CHARGER LES CARTES LIVE
========================================================= */

async function fetchLiveStreams(
  category = "soccer"
){


  const scrollEl =
    document.getElementById(
      'live-scroll'
    );


  try{


    const res =
      await fetch(
        `${API_BASE}/streams?category=${encodeURIComponent(category)}`
      );


    if(
      !res.ok
    ){

      throw new Error(
        `Erreur API : ${res.status}`
      );

    }


    const data =
      await res.json();


    /*
      Compteur.
    */

    document.getElementById(
      'live-count'
    ).textContent =
      `(${data.count || 0} live)`;


    /*
      Nettoyage.
    */

    scrollEl.innerHTML =
      "";


    /*
      Aucun résultat.
    */

    if(
      !data.streams ||
      data.streams.length === 0
    ){

      scrollEl.innerHTML = `

        <div
          style="
            padding:30px;
            color:#777;
          "
        >

          Aucun match en direct
          pour le moment.

        </div>

      `;

      return;

    }


    /*
      Créer les cartes.
    */

    data.streams.forEach(
      stream => {


        const card =
          document.createElement(
            'div'
          );


        card.className =
          'card';


        card.tabIndex =
          0;


        card.dataset.title =
          stream.name ||
          "Événement en direct";


        card.dataset.embed =
          stream.embed_url ||
          "";


        card.dataset.thumbnail =
          stream.thumbnail_url ||
          "";


        if(
          stream.thumbnail_url
        ){

          card.style.backgroundImage =
            `url("${stream.thumbnail_url}")`;

        }


        const meta =
          document.createElement(
            'div'
          );


        meta.className =
          'meta';


        meta.textContent =
          stream.league ||
          stream.category ||
          "Live";


        card.appendChild(
          meta
        );


        /*
          Clic.
        */

        card.addEventListener(
          'click',
          () => {


            if(
              stream.embed_url
            ){

              openStream(
                stream.name ||
                "Événement en direct",

                stream.embed_url,

                stream
              );

            }


          }
        );


        /*
          Touche Entrée.
        */

        card.addEventListener(
          'keydown',
          event => {


            if(
              event.key ===
              'Enter'
            ){

              if(
                stream.embed_url
              ){

                openStream(
                  stream.name ||
                  "Événement en direct",

                  stream.embed_url,

                  stream
                );

              }

            }


          }
        );


        scrollEl.appendChild(
          card
        );


      }
    );


  }catch(err){


    console.error(
      "Erreur Live API :",
      err
    );


    scrollEl.innerHTML = `

      <div
        style="
          padding:30px;
          color:#e50914;
        "
      >

        Impossible de charger
        les streams en direct.

      </div>

    `;

  }

}


/* =========================================================
   OUVRIR LE STREAM
========================================================= */

function openStream(
  title,
  embedUrl,
  streamData = null
){


  if(
    !embedUrl
  ){

    console.warn(
      "Aucune URL embed disponible."
    );

    return;

  }


  /*
    Titre.
  */

  modalTitle.textContent =
    title;


  /*
    Description.
  */

  if(
    streamData
  ){

    const league =
      streamData.league ||
      streamData.category ||
      "Sport";


    modalDescription.textContent =
      `${league} • Live • Qualité HD`;

  }else{

    modalDescription.textContent =
      "Événement sportif en direct.";

  }


  /*
    Cacher la vidéo MP4.
  */

  modalVideo.style.display =
    'none';


  /*
    Chercher l'iframe existante.
  */

  let iframe =
    document.getElementById(
      'stream-iframe'
    );


  /*
    Créer l'iframe
    si nécessaire.
  */

  if(
    !iframe
  ){

    iframe =
      document.createElement(
        'iframe'
      );


    iframe.id =
      'stream-iframe';


    iframe.style.width =
      '100%';


    iframe.style.aspectRatio =
      '16/9';


    iframe.style.border =
      'none';


    iframe.allowFullscreen =
      true;


    iframe.setAttribute(
      'allow',
      'autoplay; fullscreen; picture-in-picture'
    );


    const modalCard =
      modal.querySelector(
        '.modal-card'
      );


    const modalBody =
      modal.querySelector(
        '.modal-body'
      );


    modalCard.insertBefore(
      iframe,
      modalBody
    );

  }


  /*
    Charger le stream.
  */

  iframe.src =
    embedUrl;


  iframe.style.display =
    'block';


  /*
    Ouvrir le modal.
  */

  modal.classList.add(
    'open'
  );


  document.body.style.overflow =
    'hidden';

}


/* =========================================================
   FERMER LE MODAL
========================================================= */

function closeModal(){


  modal.classList.remove(
    'open'
  );


  document.body.style.overflow =
    '';


  /*
    Stopper l'iframe.
  */

  const iframe =
    document.getElementById(
      'stream-iframe'
    );


  if(
    iframe
  ){

    iframe.src =
      "";


    iframe.style.display =
      'none';

  }


  /*
    Réafficher la vidéo MP4.
  */

  modalVideo.style.display =
    'block';

}

========================================================= */

document.addEventListener(

            );

          }


        }
      );


  }
);

</script>
