<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Suggestions</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
  <style>
/* ============================= */
/*        DESIGN TOKENS          */
/* ============================= */

:root {
  --bg-main: #0f0f14;
  --bg-panel: #17171d;
  --bg-card: #1f1f27;
  --bg-input: #2a2a34;

  --border-soft: rgba(255,255,255,.08);

  --text-main: #f5f5f7;
  --text-muted: #9ca3af;

  --primary: #3b82f6;
  --primary-hover: #2563eb;
  --danger: #dc2626;
  --gold: #fbbf24;

  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;

  --shadow-sm: 0 6px 16px rgba(0,0,0,.35);
  --shadow-md: 0 20px 40px rgba(0,0,0,.45);

  --transition: all .25s ease;
}

/* ============================= */
/*          RESET & BASE         */
/* ============================= */

* {
  box-sizing: border-box;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

[hidden] { display: none !important; }

body {
  margin: 0;
  font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  background: radial-gradient(circle at top, #1a1a22, var(--bg-main));
  color: var(--text-main);
  min-height: 100vh;
}

a, a:visited {
  color: var(--text-main);
  text-decoration: none;
}

h1 {
  text-align: center;
  margin: 32px 0;
  font-weight: 700;
  letter-spacing: .4px;
}

/* ============================= */
/*        MATERIAL ICONS         */
/* ============================= */

.material-symbols-outlined {
  font-family: 'Material Symbols Outlined';
  font-weight: normal;
  font-style: normal;
  font-size: 1.2em;
  line-height: 1;
  letter-spacing: normal;
  text-transform: none;
  display: inline-block;
  white-space: nowrap;
  word-wrap: normal;
  direction: ltr;
  vertical-align: -0.2em;
  -webkit-font-smoothing: antialiased;
  font-feature-settings: 'liga';
}

/* ============================= */
/*            HEADER             */
/* ============================= */

header {
  background: rgba(20,20,28,.85);
  backdrop-filter: blur(10px);
  padding: 14px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: var(--shadow-sm);
}

/* ============================= */
/*            LAYOUT             */
/* ============================= */

.container {
  max-width: 1000px;
  margin: 0 auto 90px;
  padding: 0 16px;
}

.board-header {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
}

/* ============================= */
/*             FORM              */
/* ============================= */

.suggestion-form {
  background: linear-gradient(180deg, #23232c, #1a1a22);
  padding: 18px;
  border-radius: var(--radius-lg);
  margin-bottom: 32px;
  box-shadow: var(--shadow-md);
  border: 1px solid var(--border-soft);
}

.suggestion-form textarea {
  width: 100%;
  min-height: 85px;
  resize: vertical;
  padding: 12px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-soft);
  background: var(--bg-input);
  color: var(--text-main);
  font-size: 14px;
  font-family: inherit;
  transition: var(--transition);
}

.row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 14px;
}

.suggestion-form select,
.suggestion-form button.submit-btn {
  padding: 10px 16px;
  border-radius: var(--radius-sm);
  font-weight: 600;
  cursor: pointer;
}

.suggestion-form select {
  background: var(--bg-input);
  color: var(--text-main);
  border: 1px solid var(--border-soft);
}

.suggestion-form button.submit-btn {
  background: linear-gradient(135deg, var(--primary), #60a5fa);
  color: #fff;
  border: none;
  transition: var(--transition);
}

.suggestion-form button.submit-btn:hover {
  transform: translateY(-1px);
  background: linear-gradient(135deg, var(--primary-hover), var(--primary));
}

/* ---------- Étape 1 : choix du type ---------- */

.form-title {
  margin: 0 0 14px;
  font-size: 15px;
  font-weight: 600;
  color: var(--text-muted);
  text-align: center;
}

.type-choice {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

.type-card {
  cursor: pointer;
  text-align: center;
  padding: 26px 16px;
  border-radius: var(--radius-lg);
  border: 1px solid var(--border-soft);
  background:
    linear-gradient(180deg, rgba(255,255,255,.04), rgba(0,0,0,.15)),
    var(--bg-card);
  color: var(--text-main);
  font-family: inherit;
  transition: var(--transition);
}

.type-card:hover {
  transform: translateY(-3px);
  border-color: var(--primary);
  box-shadow: 0 0 0 2px rgba(59,130,246,.25), 0 20px 40px rgba(0,0,0,.5);
}

.type-card .ico { font-size: 38px; display: block; margin-bottom: 10px; }
.type-card .ttl { font-size: 17px; font-weight: 700; display: block; }
.type-card .sub { font-size: 12.5px; color: var(--text-muted); display: block; margin-top: 6px; line-height: 1.4; }

@media (max-width: 560px) {
  .type-choice { grid-template-columns: 1fr; }
}

/* ---------- Étape 2 : formulaire ---------- */

.form-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
  gap: 10px;
  flex-wrap: wrap;
}

.link-btn {
  background: none;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 13px;
  font-family: inherit;
  padding: 4px 0;
}
.link-btn:hover { color: var(--text-main); }

.type-pill {
  font-size: 12px;
  font-weight: 700;
  padding: 5px 12px;
  border-radius: 999px;
  background: rgba(59,130,246,.18);
  color: #bfdbfe;
  border: 1px solid rgba(59,130,246,.35);
}

/* ---------- Recherche de contenu ---------- */

.search-wrap { position: relative; }

.search-wrap input {
  width: 100%;
  padding: 13px 14px 13px 42px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-soft);
  background: var(--bg-input);
  color: var(--text-main);
  font-size: 15px;
  font-family: inherit;
}

.search-wrap::before {
  content: "🔍";
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 15px;
  opacity: .8;
}

.media-tabs {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin: 12px 0;
}

.media-tabs button {
  background: var(--bg-input);
  color: var(--text-muted);
  border: 1px solid var(--border-soft);
  padding: 6px 14px;
  border-radius: 999px;
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  transition: var(--transition);
}

.media-tabs button.active {
  background: var(--primary);
  color: #fff;
  border-color: transparent;
}

.search-status {
  text-align: center;
  color: var(--text-muted);
  font-size: 13px;
  padding: 18px 0;
}

.results-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  gap: 12px;
  max-height: 420px;
  overflow-y: auto;
  padding: 4px;
  margin-bottom: 4px;
}

.result-card {
  cursor: pointer;
  border-radius: var(--radius-md);
  overflow: hidden;
  background: var(--bg-card);
  border: 1px solid var(--border-soft);
  transition: var(--transition);
  text-align: left;
  padding: 0;
  color: var(--text-main);
  font-family: inherit;
}

.result-card:hover {
  transform: translateY(-3px);
  border-color: var(--primary);
  box-shadow: 0 10px 24px rgba(0,0,0,.5);
}

.poster {
  width: 100%;
  aspect-ratio: 2 / 3;
  object-fit: cover;
  display: block;
  background: #2a2a34;
}

.poster-empty {
  width: 100%;
  aspect-ratio: 2 / 3;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 34px;
  color: var(--text-muted);
  background: linear-gradient(135deg, #2a2a34, #1f1f27);
}

.result-info { padding: 8px 9px 10px; }
.result-title {
  font-size: 12.5px;
  font-weight: 600;
  line-height: 1.3;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.result-meta { font-size: 11px; color: var(--text-muted); margin-top: 4px; }

.kind-tag {
  display: inline-block;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: .5px;
  text-transform: uppercase;
  padding: 2px 7px;
  border-radius: 999px;
  margin-right: 4px;
}
.kind-Film  { background: #b45309; color: #fef3c7; }
.kind-Série { background: #0e7490; color: #cffafe; }
.kind-Anime { background: #be185d; color: #fce7f3; }

/* ---------- Aperçu du contenu choisi ---------- */

.media-preview {
  position: relative;
  display: flex;
  gap: 16px;
  padding: 16px;
  border-radius: var(--radius-lg);
  border: 1px solid var(--border-soft);
  background: var(--bg-card);
  overflow: hidden;
  margin-bottom: 14px;
}

.media-preview .bg {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
  opacity: .18;
  filter: blur(2px);
}

.media-preview > *:not(.bg) { position: relative; }
.media-preview .poster,
.media-preview .poster-empty { width: 110px; flex-shrink: 0; border-radius: var(--radius-md); box-shadow: var(--shadow-sm); }

.media-details h3 { margin: 0 0 6px; font-size: 18px; }
.media-details .facts { font-size: 12.5px; color: var(--text-muted); margin-bottom: 8px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.media-details .facts .star { color: var(--gold); font-weight: 700; }
.media-details .overview {
  font-size: 13px;
  line-height: 1.55;
  color: #d1d5db;
  display: -webkit-box;
  -webkit-line-clamp: 4;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin: 0;
}

.media-preview .change-btn {
  position: absolute;
  top: 10px;
  right: 10px;
  background: rgba(0,0,0,.55);
  color: #fff;
  border: 1px solid var(--border-soft);
  padding: 5px 10px;
  border-radius: var(--radius-sm);
  font-size: 12px;
  cursor: pointer;
  font-family: inherit;
}

@media (max-width: 560px) {
  .media-preview .poster,
  .media-preview .poster-empty { width: 80px; }
}

/* ============================= */
/*           SUGGESTIONS         */
/* ============================= */

.suggestions-list {
  display: grid;
  gap: 20px;
}

.suggestion {
  position: relative;
  padding: 16px;
  border-radius: var(--radius-lg);
  border: 1px solid var(--border-soft);
  background:
    linear-gradient(180deg, rgba(255,255,255,.03), rgba(0,0,0,.18)),
    var(--bg-card);
  box-shadow:
    0 1px 0 rgba(255,255,255,.04) inset,
    0 20px 40px rgba(0,0,0,.45);
  transition: var(--transition);
}

.suggestion:hover {
  transform: translateY(-3px) scale(1.005);
  box-shadow:
    0 1px 0 rgba(255,255,255,.06) inset,
    0 30px 60px rgba(0,0,0,.6);
}

.suggestion::after {
  content: "";
  position: absolute;
  inset: auto 0 0 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.08), transparent);
}

/* ============================= */
/*           HEADER CARD         */
/* ============================= */

.suggestion-header {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}

.badges { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

.meta {
  font-size: 12px;
  color: var(--text-muted);
}

/* ============================= */
/*            STATUS             */
/* ============================= */

.status-badge {
  padding: 5px 12px;
  font-size: 11px;
  border-radius: 999px;
  font-weight: 700;
  letter-spacing: .6px;
  text-transform: uppercase;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  box-shadow:
    0 0 0 1px rgba(255,255,255,.15) inset,
    0 4px 12px rgba(0,0,0,.4);
}

.status-en-attente { background: #7c3aed; color: #f5ebff; }
.status-planifie   { background: #1e40af; color: #dbeafe; }
.status-en-cours   { background: #b45309; color: #fef3c7; }
.status-termine    { background: #15803d; color: #dcfce7; }
.status-refuse     { background: #991b1b; color: #fee2e2; }

.type-badge {
  padding: 5px 10px;
  font-size: 11px;
  border-radius: 999px;
  font-weight: 600;
  background: rgba(255,255,255,.07);
  color: #d1d5db;
  border: 1px solid var(--border-soft);
}

/* ============================= */
/*            CONTENT            */
/* ============================= */

.content {
  white-space: pre-wrap;
  line-height: 1.65;
  letter-spacing: .15px;
  font-size: 15px;
  margin: 0 0 12px;
}

.media-card {
  position: relative;
  display: flex;
  gap: 16px;
  padding: 14px;
  border-radius: var(--radius-md);
  overflow: hidden;
  background: rgba(0,0,0,.25);
  border: 1px solid var(--border-soft);
  margin-bottom: 12px;
}
.media-card .bg {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
  opacity: .15;
  filter: blur(2px);
}
.media-card > *:not(.bg) { position: relative; }
.media-card .poster,
.media-card .poster-empty { width: 100px; flex-shrink: 0; border-radius: var(--radius-sm); box-shadow: var(--shadow-sm); }
.media-card h3 { margin: 0 0 6px; font-size: 17px; }
.media-card .facts { font-size: 12.5px; color: var(--text-muted); margin-bottom: 8px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.media-card .facts .star { color: var(--gold); font-weight: 700; }
.media-card .overview {
  font-size: 13px;
  line-height: 1.55;
  color: #d1d5db;
  margin: 0;
  display: -webkit-box;
  -webkit-line-clamp: 5;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

@media (max-width: 560px) {
  .media-card .poster,
  .media-card .poster-empty { width: 76px; }
}

/* ============================= */
/*            ACTIONS            */
/* ============================= */

.actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 6px;
}

.actions button,
.inline-form button {
  background: #2d2d38;
  color: #e5e7eb;
  border: 1px solid var(--border-soft);
  padding: 7px 12px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 12px;
  transition: var(--transition);
  position: relative;
}

.actions button:hover,
.inline-form button:hover {
  background: #3a3a48;
}

button:active {
  transform: translateY(1px);
}

/* ============================= */
/*           COMMENTS            */
/* ============================= */

.comment-section {
  margin-top: 14px;
  border-top: 1px dashed var(--border-soft);
  padding-top: 14px;
}

.comment {
  background:
    linear-gradient(180deg, rgba(255,255,255,.04), transparent),
    #2a2a35;
  border: 1px solid rgba(255,255,255,.06);
  padding: 8px 10px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  margin-bottom: 6px;
}

.comment strong { color: #fff; }

.comment time {
  color: var(--text-muted);
  font-size: 11px;
  margin-left: 6px;
}

/* ============================= */
/*          INLINE FORM          */
/* ============================= */

.inline-form {
  display: flex;
  gap: 8px;
  margin-top: 8px;
}

.inline-form input {
  flex: 1;
  padding: 9px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-soft);
  background: var(--bg-input);
  color: var(--text-main);
  font-size: 13px;
  transition: var(--transition);
}

/* ============================= */
/*            FILTER             */
/* ============================= */

.filter-bar {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin: 20px 0;
}

.filter-bar select {
  background: var(--bg-input);
  color: var(--text-main);
  border: 1px solid var(--border-soft);
  padding: 9px 12px;
  border-radius: var(--radius-sm);
}

/* ============================= */
/*         BADGES & STATES       */
/* ============================= */

.admin-badge {
  position: relative;
  background: linear-gradient(135deg, #e50914, #b20710);
  padding: 4px 10px;
  font-size: 11px;
  border-radius: 999px;
  font-weight: 800;
  margin-left: 8px;
  box-shadow: var(--shadow-sm);
}

.admin-badge::after {
  content: "";
  position: absolute;
  inset: -2px;
  border-radius: inherit;
  background: linear-gradient(135deg, #ff4d4d, transparent);
  opacity: .35;
  z-index: -1;
}

.danger {
  background: var(--danger) !important;
  color: #fff;
}

.danger:hover { background: #b91c1c !important; }

/* ============================= */
/*          FOCUS STATES         */
/* ============================= */

textarea:focus-visible,
input:focus-visible,
select:focus-visible,
button:focus-visible {
  outline: none;
  border-color: var(--primary);
  box-shadow:
    0 0 0 2px rgba(59,130,246,.25),
    0 0 30px rgba(59,130,246,.15);
}

/* ============================= */
/*           EMPTY / LOAD        */
/* ============================= */

.no-data {
  text-align: center;
  color: var(--text-muted);
  padding: 40px 0;
}

.loading {
  text-align: center;
  padding: 40px;
  color: var(--text-muted);
}

        currentUserInfo.innerHTML = `Connecté : <strong>${escapeHtml(currentUser.pseudo)}</strong>${isAdmin?'<span class="admin-badge">ADMIN</span>':''}`;
      }
      if (!isAdmin && initialStatusWrapper) initialStatusWrapper.remove();
    }

    /* ========= OMDb ========= */
    const detailed = new Set();   // imdbID dont la fiche détaillée est déjà chargée

    function cleanPoster(p) {
      return p && p !== 'N/A' ? p.replace(/^http:/, 'https:') : null;
    }

    function baseMedia(r) {
      const poster = cleanPoster(r.Poster);
      return {
        imdb_id: r.imdbID,
        media_type: r.Type,                       // movie | series
        kind: r.Type === 'series' ? 'Série' : 'Film',
        title: r.Title || 'Sans titre',
        year: r.Year || '',
        poster,
        backdrop: poster,                         // sert de fond flouté
        rating: null,
        overview: '',
        country: '',
        genre: ''
      };
    }

    // Charge la fiche complète (synopsis, note, pays, genre) et détecte les animes
    async function fetchDetails(m) {
      if (detailed.has(m.imdb_id)) return m;
      try {
        const res = await fetch(`https://www.omdbapi.com/?apikey=${OMDB_KEY}&i=${encodeURIComponent(m.imdb_id)}&plot=short`);
        const d = await res.json();
        if (d.Response === 'True') {
          const ok = v => v && v !== 'N/A';
          m.rating   = ok(d.imdbRating) ? parseFloat(d.imdbRating) : null;
          m.overview = ok(d.Plot) ? d.Plot : '';
          m.country  = ok(d.Country) ? d.Country.split(',')[0].trim() : '';
          m.genre    = ok(d.Genre) ? d.Genre : '';
          const jp = /Japan/i.test(d.Country || '') || /Japanese/i.test(d.Language || '');
          if (/Animation/i.test(m.genre) && jp) m.kind = 'Anime';
          if (!m.poster && ok(d.Poster)) { m.poster = cleanPoster(d.Poster); m.backdrop = m.poster; }
        }
        detailed.add(m.imdb_id);
      } catch (e) { console.error(e); }
      return m;
    }

    async function searchOMDb(query) {
      const token = ++searchToken;
      if (!OMDB_KEY || OMDB_KEY.startsWith('COLLE_')) {
        searchStatus.textContent = "⚠️ Clé OMDb manquante : ajoute-la dans le code (constante OMDB_KEY).";
        searchStatus.hidden = false;
        return;
      }
      searchStatus.textContent = 'Recherche en cours…';
      searchStatus.hidden = false;
      try {
        const jsons = await Promise.all([1, 2].map(page =>
          fetch(`https://www.omdbapi.com/?apikey=${OMDB_KEY}&s=${encodeURIComponent(query)}&page=${page}`)
            .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        ));
        if (token !== searchToken) return; // recherche périmée

        const err = jsons[0];
        if (err.Response === 'False' && err.Error && !/not found/i.test(err.Error)) {
          throw new Error(err.Error);
        }

        const seen = new Set();
        searchResults = jsons
          .flatMap(j => j.Search || [])
          .filter(r => (r.Type === 'movie' || r.Type === 'series') && !seen.has(r.imdbID) && seen.add(r.imdbID))
          .map(baseMedia);
        await applyFilter();
      } catch (e) {
        if (token !== searchToken) return;
        console.error(e);
        searchStatus.textContent = 'Erreur pendant la recherche : ' + e.message;
        searchStatus.hidden = false;
      }
    }

    // L'onglet Anime a besoin des fiches détaillées (genre + pays) pour trier
    async function applyFilter() {
      if (mediaFilter === 'Anime' && searchResults.length) {
        searchStatus.textContent = 'Détection des animes…';
        searchStatus.hidden = false;
        await Promise.all(searchResults.map(fetchDetails));
      }
      renderResults();
    }

    function posterHTML(path) {
      return path
        ? `<img class="poster" loading="lazy" referrerpolicy="no-referrer" src="${escapeHtml(path)}" alt="">`
        : `<div class="poster-empty"><span class="material-symbols-outlined">movie</span></div>`;
    }

    function factsHTML(m) {
      return `
        <span class="kind-tag kind-${escapeHtml(m.kind)}">${escapeHtml(m.kind)}</span>
        ${m.year ? `<span><span class="material-symbols-outlined">calendar_month</span> ${escapeHtml(m.year)}</span>` : ''}
        ${m.rating ? `<span class="star">★ ${escapeHtml(m.rating)}</span>` : ''}
        ${m.country ? `<span><span class="material-symbols-outlined">planet</span> ${escapeHtml(m.country)}</span>` : ''}
      `;
    }

    function renderResults() {
      const list = searchResults.filter(m => mediaFilter === 'all' || m.kind === mediaFilter);
      resultsGrid.innerHTML = '';
      if (!list.length) {
        searchStatus.textContent = searchInput.value.trim() ? 'Aucun résultat.' : '';
        searchStatus.hidden = !searchStatus.textContent;
        return;
      }
      searchStatus.hidden = true;
      list.slice(0, 24).forEach(m => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'result-card';
        btn.innerHTML = `
          ${posterHTML(m.poster)}
          <div class="result-info">
            <div class="result-title">${escapeHtml(m.title)}</div>
            <div class="result-meta"><span class="kind-tag kind-${escapeHtml(m.kind)}">${escapeHtml(m.kind)}</span>${escapeHtml(m.year)}</div>
          </div>`;
        btn.addEventListener('click', () => selectMedia(m));
        resultsGrid.appendChild(btn);
      });
    }

    async function selectMedia(m) {
      searchStatus.textContent = 'Chargement de la fiche…';
      searchStatus.hidden = false;
      await fetchDetails(m);
      searchStatus.hidden = true;
      selectedMedia = m;
      searchArea.hidden = true;
      mediaPreview.hidden = false;
      mediaPreview.innerHTML = `
        ${m.backdrop ? `<div class="bg" style="background-image:url('${escapeHtml(m.backdrop)}')"></div>` : ''}
        ${posterHTML(m.poster)}
        <div class="media-details">
          <h3>${escapeHtml(m.title)}</h3>
          <div class="facts">${factsHTML(m)}</div>
          ${m.overview ? `<p class="overview">${escapeHtml(m.overview)}</p>` : ''}
        </div>
        <button type="button" class="change-btn" id="changeMedia">Changer</button>
      `;
      $('changeMedia').addEventListener('click', clearMedia);
      suggestionText.placeholder = 'Un petit mot pour appuyer ta suggestion (facultatif)…';
    }

    function clearMedia() {
      selectedMedia = null;
      mediaPreview.hidden = true;
      mediaPreview.innerHTML = '';
      searchArea.hidden = false;
      searchInput.focus();
    }

    /* ========= Étapes du formulaire ========= */
    function chooseType(type) {
      formType = type;
      stepChoice.hidden = true;
      suggestionForm.hidden = false;

      if (type === 'improvement') {
        formTypeLabel.innerHTML = '<span class="material-symbols-outlined">settings</span> Amélioration du site';
        contentPicker.hidden = true;
        suggestionText.placeholder = 'Exprime ta suggestion d\'amélioration…';
        suggestionText.required = true;
      } else {
        formTypeLabel.innerHTML = '<span class="material-symbols-outlined">movie</span> Contenu (film, série, anime)';
        contentPicker.hidden = false;
        suggestionText.placeholder = 'Un petit mot pour appuyer ta suggestion (facultatif)…';
        suggestionText.required = false;
        clearMedia();
        searchInput.value = '';
        searchResults = [];
        resultsGrid.innerHTML = '';
        searchStatus.hidden = true;
        setTimeout(() => searchInput.focus(), 50);
      }
    }

    function resetForm() {
      formType = null;
      selectedMedia = null;
      suggestionText.value = '';
      suggestionForm.hidden = true;
      stepChoice.hidden = false;
    }

    /* ========= Chargement / Persistance Supabase ========= */
    async function loadSuggestionsFromSupabase() {
      setLoading(true);
      const { data, error } = await supabase
        .from('suggestions')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        suggestionsList.innerHTML = '<div class="loading">Erreur de chargement</div>';
        console.error(error);
        setLoading(false);
        return;
      }

      const ids = data.map(s => s.id);
      let commentsMap = {};
      if (ids.length) {
        const { data: comms, error: cErr } = await supabase
          .from('comments')
          .select('*')
          .in('suggestion_id', ids)
          .order('created_at',{ascending:true});
        if (!cErr) {
          comms.forEach(c => {
            if (!commentsMap[c.suggestion_id]) commentsMap[c.suggestion_id] = [];
            commentsMap[c.suggestion_id].push(c);
          });
        }
      }

      suggestions = data.map(s => ({ ...s, comments: commentsMap[s.id] || [] }));
      setLoading(false);
      render();
    }

    /* ========= Ajout suggestion ========= */
    async function addSuggestion(text, status, type, media) {
      const { data: { user }, error: userError } = await supabase.auth.getUser();

      let payload;
      if (user && !userError) {
        payload = {
          text, status, type, media,
          author_pseudo: currentUser?.pseudo || user.user_metadata?.username || user.email?.split('@')[0],
          author_email: currentUser?.email || user.email,
          user_id: user.id
        };
      } else {
        payload = {
          text, status, type, media,
          author_pseudo: "Invité",
          author_email: null,
          user_id: null
        };
      }

      const { data, error } = await supabase
        .from('suggestions')
        .insert(payload)
        .select()
        .single();

      if (error) {
        alert('Erreur ajout: ' + error.message);
        return false;
      }

      data.comments = [];
      suggestions.unshift(data);
      render();
      return true;
    }

    async function updateSuggestionStatus(id, newStatus) {
      const { error } = await supabase.from('suggestions').update({ status: newStatus }).eq('id', id);
      if (error) { alert('Erreur statut: '+error.message); return; }
      const s = suggestions.find(s => s.id === id);
      if (s) s.status = newStatus;
      render();
    }

    async function deleteSuggestion(id) {
      const { error } = await supabase.from('suggestions').delete().eq('id', id);
      if (error) { alert('Erreur suppression: ' + error.message); return; }
      suggestions = suggestions.filter(s => s.id !== id);
      render();
    }

    /* ========= Ajout commentaire ========= */
    async function addComment(suggestionId, text) {
      const { data: { user }, error: userError } = await supabase.auth.getUser();

      let payload;
      if (user && !userError) {
        payload = {
          suggestion_id: suggestionId,
          content: text,
          author_pseudo: currentUser?.pseudo || user.user_metadata?.username || user.email?.split('@')[0],
          author_email: currentUser?.email || user.email,
          user_id: user.id
        };
      } else {
        payload = {
          suggestion_id: suggestionId,
          content: text,
          author_pseudo: "Invité",
          author_email: null,
          user_id: null
        };
      }

      const { data, error } = await supabase.from('comments').insert(payload).select().single();
      if (error) { alert('Erreur commentaire: ' + error.message); return; }

      const s = suggestions.find(s => s.id === suggestionId);
      if (s) { s.comments.push(data); render(); }
    }

    /* ========= Rendu ========= */
    function mediaCardHTML(m) {
      return `
        <div class="media-card">
          ${m.backdrop ? `<div class="bg" style="background-image:url('${escapeHtml(m.backdrop)}')"></div>` : ''}
          ${posterHTML(m.poster)}
          <div>
            <h3>${escapeHtml(m.title)}</h3>
            <div class="facts">${factsHTML(m)}</div>
            ${m.overview ? `<p class="overview">${escapeHtml(m.overview)}</p>` : ''}
          </div>
        </div>`;
    }

    function render() {
      const fStatus = filterStatus.value;
      const fType = filterType.value;
      let list = suggestions.filter(s => {
        const isContent = s.type === 'content' && s.media;
        if (fStatus && s.status !== fStatus) return false;
        if (fType === 'improvement' && isContent) return false;
        if (fType && fType !== 'improvement' && (!isContent || s.media.kind !== fType)) return false;
        return true;
      });

      suggestionsList.innerHTML = '';
      totalCount.textContent = `${list.length} suggestion${list.length>1?'s':''}`;
      emptyMessage.style.display = list.length ? 'none' : 'block';

      list.forEach(s => {
        const div = document.createElement('div');
        div.className = 'suggestion';
        const badgeClass = 'status-' + slug(s.status || '');
        const isContent = s.type === 'content' && s.media;
        const typeLabel = isContent
          ? '<span class="material-symbols-outlined">movie</span> Contenu'
          : '<span class="material-symbols-outlined">settings</span> Amélioration';

        div.innerHTML = `
          <div class="suggestion-header">
            <div class="badges">
              <span class="status-badge ${badgeClass}">${escapeHtml(s.status)}</span>
              <span class="type-badge">${typeLabel}</span>
            </div>
            <div class="meta">
              ${s.author_pseudo ? 'Par <strong>'+escapeHtml(s.author_pseudo)+'</strong>' : '<strong>Utilisateur</strong>'}
              ${s.created_at ? ' • <time>'+formatDate(s.created_at)+'</time>' : ''}
            </div>
          </div>
          ${isContent ? mediaCardHTML(s.media) : ''}
          ${(!isContent || (s.text && s.text !== s.media.title)) ? `<p class="content">${escapeHtml(s.text)}</p>` : ''}

          <div class="actions" data-id="${s.id}">
            ${isAdmin ? statusButtonsHTML(s.status) : ''}
            ${isAdmin ? '<button data-action="delete" class="danger">Supprimer</button>' : ''}
          </div>

          <div class="comment-section">
            <strong>Commentaires (${s.comments.length})</strong>
            <div class="comments">
              ${s.comments.map(c => `
                <div class="comment">
                  <strong>${escapeHtml(c.author_pseudo || 'Anonyme')}</strong>
                  <time>${formatDate(c.created_at)}</time><br>
                  ${escapeHtml(c.content)}
                </div>`).join('')}
            </div>
            <form class="inline-form" data-id="${s.id}">
              <input type="text" placeholder="Ajouter un commentaire..." required />
              <button type="submit">Envoyer</button>
            </form>
          </div>
        `;
        suggestionsList.appendChild(div);
      });

      document.querySelectorAll('.inline-form').forEach(form => {
        form.addEventListener('submit', e => {
          e.preventDefault();
          const id = Number(form.getAttribute('data-id'));
          const input = form.querySelector('input');
          const val = input.value.trim();
          if (!val) return;
          addComment(id, val);
          input.value = '';
        });
      });

      document.querySelectorAll('.actions').forEach(block => {
        block.addEventListener('click', e => {
          const btn = e.target.closest('button');
          if (!btn) return;
          const id = Number(block.getAttribute('data-id'));
          const action = btn.getAttribute('data-action');
          if (action === 'delete' && isAdmin) {
            if (confirm('Supprimer cette suggestion ?')) deleteSuggestion(id);
          } else if (action?.startsWith('status-') && isAdmin) {
            updateSuggestionStatus(id, action.replace('status-',''));
          }
        });
      });
    }

    /* ========= Events ========= */
    document.querySelectorAll('[data-type]').forEach(btn => {
      btn.addEventListener('click', () => chooseType(btn.dataset.type));
    });
    $('backToChoice').addEventListener('click', resetForm);

    searchInput.addEventListener('input', () => {
      clearTimeout(searchTimer);
      const q = searchInput.value.trim();
      if (q.length < 2) {
        searchToken++;
        searchResults = [];
        resultsGrid.innerHTML = '';
        searchStatus.hidden = true;
        return;
      }
      searchTimer = setTimeout(() => searchOMDb(q), 350);
    });

    mediaTabs.addEventListener('click', e => {
      const b = e.target.closest('button');
      if (!b) return;
      mediaFilter = b.dataset.kind;
      mediaTabs.querySelectorAll('button').forEach(x => x.classList.toggle('active', x === b));
      applyFilter();
    });

    suggestionForm.addEventListener('submit', async e => {
      e.preventDefault();
      const note = suggestionText.value.trim();
      const status = isAdmin ? initialStatus.value : 'En Attente';

      if (formType === 'improvement') {
        if (!note) return;
        if (await addSuggestion(note, status, 'improvement', null)) resetForm();
      } else if (formType === 'content') {
        if (!selectedMedia) { alert('Choisis d\'abord un film, une série ou un anime dans les résultats.'); return; }
        if (await addSuggestion(note || selectedMedia.title, status, 'content', selectedMedia)) resetForm();
      }
    });

    filterStatus.addEventListener('change', render);
    filterType.addEventListener('change', render);

    /* ========= Initialisation ========= */
    detectLocalUser();
    await detectSupabaseUser();
    loadSuggestionsFromSupabase();
</script>

</head>
<body>
  <header>
    <div><a href="https://inspecteurl.github.io/site/index.html">← Retour</a></div>
    <div id="currentUserInfo"></div>
  </header>
  <h1>Suggestions</h1>

  <div class="container">
    <div class="board-header">
      <div class="filter-bar">
        <select id="filterStatus">
          <option value="">Tous les statuts</option>
          <option value="En Attente">En Attente</option>
          <option value="Planifié">Planifié</option>
          <option value="En cours">En cours</option>
          <option value="Terminé">Terminé</option>
          <option value="Refusé">Refusé</option>
        </select>
        <select id="filterType">
          <option value="">Tous les types</option>
          <option value="improvement">Améliorations</option>
          <option value="Film">Films</option>
          <option value="Série">Séries</option>
          <option value="Anime">Animes</option>
        </select>
      </div>
      <div id="totalCount">Suggestions : 0</div>
    </div>

    <div class="suggestion-form">

      <!-- Étape 1 : choix du type -->
      <div id="stepChoice">
        <p class="form-title">Que veux-tu suggérer ?</p>
        <div class="type-choice">
          <button type="button" class="type-card" data-type="improvement">
            <span class="ico"><span class="material-symbols-outlined">settings</span></span>
            <span class="ttl">Amélioration du site</span>
            <span class="sub">Une idée de fonctionnalité, un bug, un changement de design…</span>
          </button>
          <button type="button" class="type-card" data-type="content">
            <span class="ico"><span class="material-symbols-outlined">movie</span></span>
            <span class="ttl">Contenu à ajouter</span>
            <span class="sub">Un film, une série ou un anime que tu aimerais voir sur le site</span>
          </button>
        </div>
      </div>

      <!-- Étape 2 : formulaire -->
      <form id="suggestionForm" hidden>
        <div class="form-top">
          <button type="button" class="link-btn" id="backToChoice">← Changer de type</button>
          <span class="type-pill" id="formTypeLabel"></span>
        </div>

        <div id="contentPicker" hidden>
          <div id="searchArea">
            <div class="search-wrap">
              <input type="search" id="searchInput" placeholder="Cherche un film, une série ou un anime…" autocomplete="off" />
            </div>
            <div class="media-tabs" id="mediaTabs">
              <button type="button" class="active" data-kind="all">Tout</button>
              <button type="button" data-kind="Film"><span class="material-symbols-outlined">movie</span> Films</button>
              <button type="button" data-kind="Série">📺 Séries</button>
              <button type="button" data-kind="Anime">🌸 Animes</button>
            </div>
            <div class="search-status" id="searchStatus" hidden></div>
            <div class="results-grid" id="resultsGrid"></div>
          </div>
          <div class="media-preview" id="mediaPreview" hidden></div>
        </div>

        <textarea id="suggestionText" placeholder="Exprime ta suggestion..."></textarea>

        <div class="row">
          <!-- wrapper retiré automatiquement pour les non-admins -->
          <div id="initialStatusWrapper">
            <select id="initialStatus">
              <option value="En Attente">En Attente</option>
              <option value="Planifié">Planifié</option>
              <option value="En cours">En cours</option>
              <option value="Terminé">Terminé</option>
              <option value="Refusé">Refusé</option>
            </select>
          </div>
          <button type="submit" class="submit-btn">Envoyer ma suggestion</button>
        </div>
      </form>
    </div>

    <div id="emptyMessage" class="no-data">Aucune suggestion pour le moment.</div>
    <div id="suggestionsList" class="suggestions-list"></div>
  </div>
</body>
</html>
